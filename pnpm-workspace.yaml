packages:
  - apps/*
  - apps/blog/worker
  - packages/*
  - adapters/*
  - tooling/*

# Uma versão por dependência no repositório (ADR 0003).
# Adicione aqui primeiro e use "catalog:" no package.json da unidade.
catalogMode: strict
catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/node': 11.1.6
  '@aws-sdk/client-s3': 3.1142.0
  '@axe-core/playwright': 4.13.0
  '@eslint/js': 10.0.1
  '@next/env': 16.3.6
  '@next/eslint-plugin-next': 16.3.6
  '@playwright/test': 1.63.0
  '@sentry/nextjs': 11.1.0
  '@sentry/node': 11.1.0
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-table': 9.2.4
  '@types/node': 24.19.0
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.0.2
  astro: 7.3.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-astro: 3.2.1
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.12.0
  graphile-worker: 0.18.0
  happy-dom: 20.14.5
  isbot: 5.2.2
  jose: 6.2.12
  lefthook: 2.1.14
  next: 16.3.6
  pagefind: 1.5.2
  pg: 8.23.0
  pino: 10.3.1
  prettier: 3.9.9
  prettier-plugin-astro: 1.1.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.5
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vitest: 5.0.2
  wrangler: 4.143.0
  zod: 4.6.5

engineStrict: true
# Espera 24 h antes de instalar versões recém-publicadas (padrão do pnpm 11, explícito aqui).
minimumReleaseAge: 1440
allowBuilds:
  lefthook: true
  # Runtime local e bundler do wrangler (apps/blog/worker).
  workerd: true
  esbuild: true
