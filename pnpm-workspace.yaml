engineStrict: true
# Espera 24 h antes de instalar versões recém-publicadas (padrão do pnpm 11, explícito aqui).
minimumReleaseAge: 1440
allowBuilds:
  lefthook: true
  # Runtime local e bundler do wrangler (apps/blog/worker).
  workerd: true
  esbuild: true
  # Ingestão de imagens do Backoffice: binários pré-compilados (@img/sharp-*), sem compilar.
  sharp: false
