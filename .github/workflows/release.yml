# Release do core (ADR 0005): a tag manual core-vX.Y.Z publica a imagem site-builder
# com a tag X.Y.Z. Merge na main não cria release. A imagem é testada em todo PR pelo
# job "Imagem site-builder" do ci.yml.
name: Release

on:
  push:
    tags:
      - 'core-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  site-builder:
    name: Imagem site-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake do grupo release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: TAG="${REF_NAME#core-v}" docker/bake.sh release --push
