spec_version: 1
scope: unit
inherits: ../../../docs/project-spec.yaml
input:
  kind: payload
  paths:
    - Orakel-AI-Content/workspace:docs/platform-requirements/12.0-fase-0-ambiente-local.md
  sha256:
    Orakel-AI-Content/workspace:docs/platform-requirements/12.0-fase-0-ambiente-local.md: 06f9e91d0f9ae0efd7f1dfd90077bff69d0dba6e39a0010dbbdbd35d7ca4f44b
  summary: >-
    Linha packages/events do bloco do monorepo (12.0, seção 11.1), etapa L6 (seção 6) e as
    linhas Validação, Privacidade, Dados e Script do navegador do bloco do Worker de borda
    (seção 11.3). Texto em docs/decisions/0001-entrada.md.
project:
  name: events
  type: [lib]
  goal: >-
    Contrato dos eventos entre o Worker de borda (grava) e o agregador (lê): payload,
    manifesto, layout posicional do Analytics Engine, regras de sessão e o script do
    navegador, por versão do formato.
  scale: mvp

decisions:
  stack.language: { value: TypeScript 6 estrito, source: inherited }
  stack.runtime:
    {
      value: 'sem runtime próprio: roda no Worker (workerd), no agregador (Node) e, o subcaminho client, no navegador',
      source: inferred,
    }
  stack.framework:
    {
      value: not_applicable,
      rationale: 'Lib; Zod 4.6.5 só no lado do servidor, nunca no navegador',
      source: inferred,
    }

  architecture.macro:
    {
      value: 'Pacote de domínio do plano de eventos; consumidores: blog-worker (valida e grava), agregador do backoffice (lê), blog (script e manifesto no build)',
      source: input,
      input_ref: '11.1; mapa de contratos da raiz',
    }
  architecture.versioning:
    {
      value: 'src/v1/ com subcaminho @orakel/events/v1; o "." só com SUPPORTED_FORMAT_VERSIONS, Result e Issue; versão antiga só recebe mudanças aditivas',
      source: recommended,
      input_ref: '11.1 — "formato versionado"',
    }
  architecture.payload:
    {
      value: 'formatVersion, type pageview, eventId (UUID), page ({ articleId } ou { pageType, path }), referrer? (até 1024), sid? (UUID); site, horário, país e IP nunca vêm do payload; corpo até 2048 bytes',
      source: input,
      input_ref: 'L6; Worker "Validação" e "Privacidade"',
      provisional: true,
    }
  architecture.layout:
    {
      value: 'index1 site; blob1 versão; blob2 tipo; blob3 caminho; blob4 artigo; blob5 país; blob6 dispositivo; blob7 host do referrer; blob8 sid; blob9 motivo do descarte; double1 = 1',
      source: input,
      input_ref: 'L6 — layout posicional v1 (proposta); blob9 acrescentado (ADR 0005)',
      provisional: true,
    }
  architecture.manifest:
    {
      value: 'EventManifestSchema { formatVersion, articles: [{ id, path }] } em /_data/events-manifest.json, gerado pelo build (buildEventManifest) e lido pelo Worker (parseEventManifest, indexManifest)',
      source: recommended,
      input_ref: 'Worker "Validação"',
      provisional: true,
    }
  architecture.browser_script:
    {
      value: '@orakel/events/v1/client sem dependências de runtime: createPageviewTracker({ storage, send, now, uuid }) + startPageviewTracking(page); 741 B gzip',
      source: recommended,
      input_ref: 'Worker "Script do navegador"',
    }
  architecture.discards:
    {
      value: 'Ponto blob2 = discard com motivo em blob9 (bot, origin, size, schema, manifest), sem sid, caminho nem referrer',
      source: recommended,
      input_ref: 'Worker "Observabilidade"',
    }
  architecture.session:
    {
      value: 'Sem ID de sessão no EEE, Reino Unido e Suíça, nem com país desconhecido (XX, T1, ausente); 30 min de inatividade',
      source: input,
      input_ref: 'Worker "Privacidade" e "Script do navegador"',
    }
  architecture.code_design:
    {
      value: 'Camada domain, funções puras, Result com Issue; valores gravados em inglês',
      source: inherited,
    }
  architecture.folder_structure: { value: aprovada (ver structure.tree), source: user }

  integration.path: { value: packages/events, source: inferred }
  integration.name: { value: '@orakel/events', source: inferred }
  integration.dependencies: { value: 'zod (catalog:); sem dependências internas', source: inferred }
  integration.tasks:
    { value: 'lint, typecheck (tsconfig principal + src/v1/client), test', source: inferred }
  integration.ci: { value: 'coberto pelo filtro packages/** do ci.yml', source: inherited }
  integration.compose: { value: not_applicable, rationale: Sem processo, source: inferred }
  integration.env: { value: not_applicable, rationale: Sem variáveis de ambiente, source: inferred }

  data.persistence:
    {
      value: not_applicable,
      rationale: 'O pacote só define o formato; quem grava é o Worker',
      source: inferred,
    }
  security.validation: { value: Zod 4.6.5 (lado do servidor), source: inferred }
  security.authentication: { value: not_applicable, rationale: Lib, source: inferred }
  security.authorization: { value: not_applicable, rationale: Lib, source: inferred }
  security.config_and_secrets: { value: not_applicable, rationale: Lib, source: inferred }

  lib.public_api:
    { value: 'exports ".", "./v1", "./v1/client"; sideEffects: false', source: recommended }
  lib.publication: { value: not_applicable, rationale: Pacote interno, source: inherited }

  quality.tests:
    {
      value: 'Vitest em Node: schemas, layout posição por posição, sessão e tracker com dublês; 90% de linhas e branches',
      source: inherited,
    }
  quality.lint_format:
    {
      value: "ESLint layer('domain') + proibição de zod e de import de runtime de payload/manifest/layout em src/v1/client/**",
      source: recommended,
    }
  quality.typecheck:
    { value: 'tsc --noEmit (servidor) + tsc -p src/v1/client (DOM)', source: recommended }

  ops.container:
    {
      value: 'Dockerfile só de teste; alvo events-test fora dos grupos images e release; fora do CI',
      source: recommended,
      rationale: Mesmo padrão do content-model,
    }
  ops.error_handling:
    {
      value: 'Result com Issue; códigos size, json e schema.* para o Worker mapear o motivo do descarte',
      source: inherited,
    }
  ops.observability:
    {
      value: not_applicable,
      rationale: 'Sem processo; os descartes são um tipo de ponto do layout',
      source: inferred,
    }
  ops.deploy:
    {
      value: not_applicable,
      rationale: 'Chega à borda no Worker e ao agregador na imagem do backoffice',
      source: inferred,
    }

  extra.aggregation:
    {
      value: 'Agregador conta com SUM(_sample_interval) e usa o dia de America/Sao_Paulo; lê a versão corrente e a anterior pelo blob1',
      source: input,
      input_ref: 'L6 — agregador',
    }
  extra.device-classes:
    {
      value: 'mobile, tablet, desktop (classificação pelo user-agent, no Worker)',
      source: recommended,
    }

commands:
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  test_one: pnpm vitest run <caminho>
  from_root: pnpm turbo run lint typecheck test --filter=@orakel/events
  docker_test: docker buildx bake events-test

structure:
  tree: |
    packages/events/
    ├── CLAUDE.md  README.md  package.json  tsconfig.json  eslint.config.js  vitest.config.ts  Dockerfile
    ├── .claude/{settings.json, rules/{format,client,layout}.md}
    ├── docs/{README.md, project-spec.yaml, architecture/, conventions/testing.md, decisions/}
    └── src/
        ├── index.ts  result.ts
        └── v1/
            ├── index.ts  version.ts  routes.ts  session.ts  payload.ts  manifest.ts  layout.ts  test-builders.ts
            └── client/{tsconfig.json, tracker.ts, index.ts}
  paths:
    format: src/v1/
    client: src/v1/client/
    layout: src/v1/layout.ts

open_questions:
  - 'Layout v1, limite de 2 kB do corpo e caminho do manifesto são proposta — calibrar na fase 0 (L6)'
  - 'Mensagem da fila de cliques, eventos de impressão e clique e blocos de afiliado no manifesto — fase 3'
  - 'Sinal de consentimento para emitir sessão no EEE, Reino Unido e Suíça — fase 3, com o CMP'
