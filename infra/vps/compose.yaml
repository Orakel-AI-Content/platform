# Compose base da VPS (produção). O ambiente local aplica infra/local/compose.override.yaml
# por cima deste arquivo (pnpm local:up). Os serviços das unidades (backoffice web,
# worker, build-runner, aggregator) entram aqui quando cada unidade for gerada.
name: orakel

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orakel}
    volumes:
      # A imagem do Postgres 18 guarda os dados em /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
