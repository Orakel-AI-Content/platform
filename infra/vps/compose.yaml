# Compose base da VPS (produção). O ambiente local aplica infra/local/compose.override.yaml
# por cima deste arquivo (pnpm local:up), só com os substitutos da nuvem e as portas locais.
#
# Redes (ADR 0010 da raiz), com nome fixo: o build-runner cria os containers efêmeros do
# site-builder (render, publish) nelas pelo nome.
#   orakel-internal  serviços da VPS entre si
#   orakel-export    API de exportação: backoffice-web, blog-preview e os render; sem internet
#   orakel-publish   publish, destino do deploy e build-cache; nunca a API interna
#   orakel-docker    só build-runner e docker-socket-proxy
name: orakel

# Imagem e ambiente comuns aos processos do backoffice (uma imagem, quatro comandos).
x-backoffice: &backoffice
  image: ${IMAGE_REGISTRY:-ghcr.io/orakel-ai-content}/backoffice:${BACKOFFICE_TAG:-local}
  restart: unless-stopped
  environment: &backoffice-env
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orakel}
    ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?defina ACCESS_TEAM_DOMAIN}
    ACCESS_JWKS_URL: ${ACCESS_JWKS_URL:?defina ACCESS_JWKS_URL}
    ACCESS_AUD: ${ACCESS_AUD:?defina ACCESS_AUD}
    EXPORT_BUILD_TOKEN: ${EXPORT_BUILD_TOKEN:?defina EXPORT_BUILD_TOKEN}
    EXPORT_PREVIEW_TOKEN: ${EXPORT_PREVIEW_TOKEN:?defina EXPORT_PREVIEW_TOKEN}
    GENERATOR_TOKEN: ${GENERATOR_TOKEN:?defina GENERATOR_TOKEN}
    S3_ENDPOINT: ${S3_ENDPOINT:?defina S3_ENDPOINT}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY}
    # Visualização dos sites (blog-preview) como o navegador de quem revisa a vê.
    PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:?defina PREVIEW_BASE_URL}
    SENTRY_DSN: ${SENTRY_DSN:-}
    HEARTBEAT_BASE_URL: ${HEARTBEAT_BASE_URL:-}
    # Janela de agrupamento dos builds (12.0, L3): 900 em produção, 30 no local.
    BUILD_WINDOW_SECONDS: ${BUILD_WINDOW_SECONDS:-900}
  networks: [internal]

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orakel}
    volumes:
      # A imagem do Postgres 18 guarda os dados em /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  # Migrações do Drizzle e do Graphile Worker; sai depois de aplicar (só aditivas).
  backoffice-migrate:
    <<: *backoffice
    restart: 'no'
    command: ['node', 'src/bin/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy

  backoffice-web:
    <<: *backoffice
    command: ['node', '.next/standalone/apps/backoffice/server.js']
    networks: [internal, export]
    depends_on:
      backoffice-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  # Graphile Worker: jobs gerais e agregador (cron).
  backoffice-worker:
    <<: *backoffice
    command: ['node', 'src/bin/worker.ts']
    depends_on:
      backoffice-migrate:
        condition: service_completed_successfully

  # Só a task build, dois builds por vez (ADR 0018 da plataforma). Fala com o Docker pelo
  # docker-socket-proxy, nunca pelo socket; cria render e publish nas redes export e publish
  # (ADR 0008 do backoffice). Único serviço com o token de deploy, repassado só ao publish.
  build-runner:
    <<: *backoffice
    command: ['node', 'src/bin/build-runner.ts']
    # Um deploy espera o build em andamento terminar: render (20 min) + publish (10 min) +
    # 30 s de folga. Se o processo morrer mesmo assim, a partida libera a fila (#453).
    stop_grace_period: 1830s
    environment:
      <<: *backoffice-env
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SITE_BUILDER_IMAGE: ${IMAGE_REGISTRY:-ghcr.io/orakel-ai-content}/site-builder
      # Tag até a primeira promoção registrar a release do site.
      SITE_BUILDER_TAG: ${SITE_BUILDER_TAG:-local}
      DEPLOY_TARGET: ${DEPLOY_TARGET:?defina DEPLOY_TARGET}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    networks: [internal, docker]
    depends_on:
      backoffice-migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

  # API do Docker com permissão mínima (ADR 0011 da raiz): só as rotas que o build-runner
  # usa — criar, iniciar, matar e apagar containers; criar e apagar volumes; ler o estado e
  # os arquivos de resultado (archive). Recusa exec, pull, build, redes e o resto. O corpo
  # do create é garantido pelo código.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    # Grupo do socket no host (0 no Docker Desktop; o gid do grupo docker na VPS).
    user: '65534:${DOCKER_SOCKET_GID:-0}'
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=build-runner
      - -allowHEAD=^(/v1\.[0-9]+)?/_ping$
      - -allowGET=^(/v1\.[0-9]+)?/(_ping|version|containers/[a-zA-Z0-9_.-]+/(json|logs|archive)|images/.+/json|volumes/[a-zA-Z0-9_.-]+)$
      - -allowPOST=^(/v1\.[0-9]+)?/(containers/create|containers/[a-zA-Z0-9_.-]+/(start|wait|kill)|volumes/create)$
      - -allowDELETE=^(/v1\.[0-9]+)?/(containers|volumes)/[a-zA-Z0-9_.-]+$
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # Visualização dos rascunhos de todos os sites (site-builder, entrypoint ssr), com a
  # imagem da release corrente; o backoffice a troca quando uma release é promovida.
  blog-preview:
    image: ${IMAGE_REGISTRY:-ghcr.io/orakel-ai-content}/site-builder:${SITE_BUILDER_TAG:-local}
    restart: unless-stopped
    command: ['ssr']
    environment:
      CONTENT_SOURCE: api
      EXPORT_API_URL: http://backoffice-web:3000
      EXPORT_PREVIEW_TOKEN: ${EXPORT_PREVIEW_TOKEN:?defina EXPORT_PREVIEW_TOKEN}
      PORT: '4321'
    networks: [internal, export]
    depends_on:
      backoffice-web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/').then(() => process.exit(0), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  internal:
    name: orakel-internal
  export:
    name: orakel-export
    # Sem saída para a internet: o render só alcança a API de exportação.
    internal: true
  publish:
    name: orakel-publish
  docker:
    name: orakel-docker
    internal: true

volumes:
  postgres-data:
