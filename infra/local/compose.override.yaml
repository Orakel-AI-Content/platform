# Override do ambiente local (ADR 0008): portas no host e o emulador S3.
# Em produção o armazenamento S3 é externo (provedor a definir no primeiro deploy).
services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

configs:
  s3-identities:
    content: |
      {
        "identities": [
          {
            "name": "orakel",
            "credentials": [
              { "accessKey": "${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID}", "secretKey": "${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY}" }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

volumes:
  s3-data:
